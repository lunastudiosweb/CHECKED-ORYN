
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | CHECKED ORYN</title>
    <link rel="stylesheet" href="css/auth.css">
    <style>
        .dashboard {
            width: 100%;
            max-width: 700px;
            padding: 40px;
            background: #111;
            border: 1px solid #252525;
            border-radius: 18px;
        }

        .dashboard h1 {
            margin: 15px 0;
            font-size: 34px;
        }

        .dashboard p {
            color: #999;
            line-height: 1.7;
        }

        .profile-info {
            margin: 28px 0;
            padding: 20px;
            background: #191919;
            border: 1px solid #303030;
            border-radius: 12px;
        }

        .profile-info strong {
            display: block;
            margin-bottom: 8px;
        }

        .logout-button {
            justify-content: center;
            background: #292929;
            color: white;
        }

        .logout-button:hover {
            background: #444;
        }

        @media (max-width: 480px) {
            .dashboard { padding: 25px; }
        }
    </style>
</head>
<body>
    <main class="auth-container">
        <a href="index.html" class="brand">
            <span class="brand-symbol">O</span>
            CHECKED ORYN
        </a>

        <section class="dashboard">
            <span class="eyebrow">YOUR SPACE</span>
            <h1>Welcome, <span id="welcomeName">...</span>.</h1>
            <p>You're now inside CHECKED ORYN. Your account is connected and your next chapter starts here.</p>

            <div class="profile-info">
                <strong>Your account</strong>
                <p>Username: <span id="profileUsername">Loading...</span></p>
                <p>Email: <span id="profileEmail">Loading...</span></p>
            </div>

            <button class="logout-button" id="logoutButton">
                Log out
            </button>

            <div id="homeMessage" class="message" role="status"></div>
        </section>

        <footer>CHECKED ORYN © <span id="year"></span></footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
