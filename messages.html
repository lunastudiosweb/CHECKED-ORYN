<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messages — CHECKED ORYN</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/servers.css">
    <link rel="stylesheet" href="css/messages.css">
    <link rel="stylesheet" href="css/scrollbar.css">
</head>

<body>

<div class="srv-app dm-app" id="srvApp">

    <nav class="srv-rail" aria-label="Navigation">
        <a href="home.html" class="rail-btn rail-home" title="Home">⌂</a>
        <div class="rail-sep"></div>
        <a href="servers.html" class="rail-btn" title="Servers">◈</a>
        <a href="messages.html" class="rail-btn active" title="Messages">▤</a>
    </nav>

    <aside class="srv-channels" id="channelPanel">

        <div class="dm-search">
            <input id="dmSearch" type="text" placeholder="Find a person…" autocomplete="off" maxlength="40">
            <div class="dm-results" id="dmResults" hidden></div>
        </div>

        <div class="channel-group-head"><span>DIRECT MESSAGES</span></div>
        <div class="channel-list" id="convList"></div>

        <div class="user-panel">
            <div class="avatar" id="meAvatar">?</div>
            <div class="user-panel-text">
                <strong id="meName">Loading…</strong>
                <span id="meHandle">&nbsp;</span>
            </div>
        </div>

    </aside>

    <main class="srv-chat">

        <header class="chat-header">
            <button class="icon-btn mobile-only" id="channelsToggle" type="button" aria-label="Show conversations">☰</button>
            <h1 id="chatTitle">Messages</h1>
            <span class="spacer"></span>
            <button class="icon-btn" id="dmSettingsBtn" type="button" aria-label="Conversation options" title="Conversation options" hidden>⚙</button>
        </header>

        <div class="message-list" id="messageList"></div>

        <div class="srv-empty" id="emptyState">
            <div class="srv-empty-icon">▤</div>
            <h2>Your messages</h2>
            <p>Search for someone on the left to start a private conversation.</p>
        </div>

        <p class="typing-line" id="typingLine" hidden></p>

        <div class="attach-preview" id="attachPreview" hidden></div>

        <form class="composer" id="composer" autocomplete="off" hidden>
            <button class="attach-btn" id="attachBtn" type="button" title="Attach an image or GIF" aria-label="Attach an image or GIF">＋</button>
            <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
            <textarea id="messageInput" rows="1" maxlength="2000" placeholder="Message"></textarea>
            <button class="primary-button" id="sendBtn" type="submit">Send</button>
        </form>

    </main>

</div>

<div class="modal-backdrop lightbox" id="lightbox" hidden>
    <button class="modal-close" data-close type="button" aria-label="Close">✕</button>
    <img id="lightboxImg" alt="">
</div>

<!-- conversation options (cog) -->
<div class="member-menu" id="dmMenu" hidden></div>

<!-- nickname -->
<div class="modal-backdrop" id="nickModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="nickTitle">
        <button class="modal-close" data-close type="button" aria-label="Close">✕</button>
        <h2 id="nickTitle">Set nickname</h2>
        <form id="nickForm">
            <label for="nickInput">Nickname</label>
            <input id="nickInput" type="text" maxlength="40" placeholder="Only you can see this" autocomplete="off">
            <p class="form-hint">Shown instead of their name in your messages. Leave empty to remove it.</p>
            <p class="form-error" id="nickError"></p>
            <button class="primary-button wide" type="submit">Save nickname</button>
        </form>
    </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/messages.js"></script>

</body>
</html>
